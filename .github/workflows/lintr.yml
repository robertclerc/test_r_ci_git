name: Lint and Test R code

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::lintr
            any::testthat
            any::here
            any::covr

      - name: Run lintr
        run: |
          Rscript -e "lintr::lint_dir()"

      - name: Run tests
        run: |
          Rscript -e "testthat::test_dir('tests/testthat')"      
          
      - name: Run covr
        run: |
          Rscript coverage/coverage.R
          
          
          
  



