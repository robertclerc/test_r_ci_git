name: Lint R code

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  lintr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::lintr

      - name: Run lintr
        run: |
          Rscript -e "lintr::lint_dir()"
